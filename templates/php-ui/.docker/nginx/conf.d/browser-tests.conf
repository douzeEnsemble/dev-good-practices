# Vhost dédié aux tests navigateur (Panther) : même pool php-fpm que le vhost principal, mais
# APP_ENV=test pour que l'application lise .env.test et non l'environnement de développement.
# Voir PANTHER_EXTERNAL_BASE_URI (phpunit.snippet.xml).
server {
    listen 8081;
    listen [::]:8081;

    root /app/public;
    index index.php index.html;
    server_name _;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param APP_ENV test;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }
}
