# Navigateurs pour les tests de bout en bout (PHP-14). Se combine au compose de base :
#   COMPOSE_FILE=docker-compose.yaml:docker-compose.ui.yaml   (à mettre dans .env.ci et .env.dev)
# Le service PHP attend que les deux navigateurs soient prêts.
services:
  php:
    depends_on:
      chrome:
        condition: service_healthy
      firefox:
        condition: service_healthy

  chrome:
    image: selenium/standalone-chromium:4
    shm_size: '2g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  firefox:
    image: selenium/standalone-firefox:4
    shm_size: '2g'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4444/status"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
