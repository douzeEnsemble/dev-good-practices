server {
    listen 8080 default_server;
    listen [::]:8080 default_server;

    root /app/public;
    index index.php index.html;
    server_name _;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        # Nom du service PHP dans docker-compose.yaml
        fastcgi_pass php:9000;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        # Un chemin qui contient le contrôleur frontal (/index.php/x) répond 404
        internal;

        proxy_set_header x-forwarded-host $host;
        proxy_set_header x-forwarded-remoteaddr $remote_addr;
        proxy_set_header x-forwarded-for $proxy_add_x_forwarded_for;
        proxy_set_header x-forwarded-proto $scheme;
    }

    # Tout autre fichier .php : 404 (seul le contrôleur frontal est exposé)
    location ~ \.php$ {
        return 404;
    }
}
