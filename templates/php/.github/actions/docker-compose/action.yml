name: Docker Compose up
description: Construit (avec cache), démarre les services et prépare la base de test
runs:
  using: "composite"
  steps:
    - name: Copy .env file
      shell: bash
      run: cp .env.ci .env

    - name: Export host UID/GID for Docker build
      shell: bash
      run: |
        echo "APP_UID=$(id -u)" >> "$GITHUB_ENV"
        echo "APP_GID=$(id -g)" >> "$GITHUB_ENV"

    - name: Restore Docker images archive cache
      id: docker-images-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /tmp/docker-images-cache/images.tar
        # Clé = hash des Dockerfile + compose + UID/GID : adapter la liste des fichiers
        key: docker-images-${{ runner.os }}-${{ hashFiles('.docker/**/Dockerfile', '.docker/php/conf.d/**', 'docker-compose.yaml') }}-${{ env.APP_UID }}-${{ env.APP_GID }}

    - name: Load cached Docker images
      if: steps.docker-images-cache.outputs.cache-hit == 'true'
      shell: bash
      run: docker load -i /tmp/docker-images-cache/images.tar || true

    - name: Setup Docker Buildx
      if: steps.docker-images-cache.outputs.cache-hit != 'true'
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

    - name: Docker Buildx Bake
      if: steps.docker-images-cache.outputs.cache-hit != 'true'
      uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
      with:
        load: true
        set: |
          *.cache-to=type=gha,mode=max
          *.cache-from=type=gha

    - name: Start services
      shell: bash
      run: docker compose up --wait

    - name: Save Docker images archive cache
      if: steps.docker-images-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        mkdir -p /tmp/docker-images-cache
        docker save $(docker compose config --images) -o /tmp/docker-images-cache/images.tar || true

    - name: Save Docker images archive cache (upload)
      if: steps.docker-images-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: /tmp/docker-images-cache/images.tar
        key: ${{ steps.docker-images-cache.outputs.cache-primary-key }}

    - name: Composer install
      shell: bash
      run: docker compose exec -T php composer install --prefer-dist --no-progress --no-interaction

    - name: Create test database
      shell: bash
      run: |
        docker compose exec -T php bin/console -e test doctrine:database:create --if-not-exists
        docker compose exec -T php bin/console -e test doctrine:migrations:migrate --no-interaction --allow-no-migration

    - name: Doctrine schema validator
      shell: bash
      run: docker compose exec -T php bin/console doctrine:schema:validate --skip-sync
