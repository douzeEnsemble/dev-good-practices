name: Release

# À chaque push sur main : semantic-release lit les Conventional Commits depuis le dernier tag
# (GIT-07). feat/fix/perf/build(deps) ou un changement cassant donne un tag vX.Y.Z et une
# *prerelease* GitHub, qui construit l'image de staging (push.yml). La promotion en release
# (prod) se fait ensuite en publiant la prerelease.
on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Jeton dédié (UPD-02), pas GITHUB_TOKEN : sinon la release créée ne déclencherait pas push.yml
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: npx --yes -p semantic-release@25 -p @semantic-release/exec@7 semantic-release
