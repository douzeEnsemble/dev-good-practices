name: app

services:
  database:
    image: postgres:18.6-alpine3.24
    volumes:
      - db_data:/var/lib/postgresql
    environment:
      # Identifiants de développement uniquement (ceux de .env.ci et phpunit.xml.dist)
      - POSTGRES_DB=${POSTGRES_DB:-app}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-!ChangeMe!}
      - POSTGRES_USER=${POSTGRES_USER:-app}
    # Le service PHP n'est démarré qu'une fois la base prête (depends_on ci-dessous) ; `up --wait`
    # attend aussi ce healthcheck.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-app} -d $${POSTGRES_DB:-app}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  # Serveur de mock HTTP qui rejoue des fixtures JSON (PHP-09) : un service par jeu de mocks.
  # Décommenter et adapter ; l'application pointe sur http://mock.exemple dans .env.ci / .env.dev.
  # mock.exemple:
  #   build:
  #     context: ./.docker/moco
  #     args:
  #       MOCO_VERSION: 1.6.1
  #   volumes:
  #     - ./tests/resources/moco:/var/moco:ro
  #   command: "/var/moco/exemple.moco.json"

  php:
    build:
      context: .
      dockerfile: ./.docker/php/Dockerfile
      target: php_dev
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    volumes:
      - .:/app
    depends_on:
      database:
        condition: service_healthy
    tty: true

  web:
    image: nginx:1.31.8-alpine3.24
    depends_on:
      - php
    volumes:
      - .:/app
      - ./.docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    ports:
      # Liés à 127.0.0.1 : jamais exposé au réseau local par défaut
      - '127.0.0.1:8080:8080'

volumes:
  db_data:
